<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>LossLens - Your Path Beyond Gambling</title>
    <style>
      html, body { margin: 0; background: #0B1220; }
      #boot-loader {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        flex-direction: column; background: #0B1220; z-index: 9999;
      }
      #boot-loader .brand-mark-spin { transform-origin: 50px 50px; animation: brand-spin 14s ease-in-out infinite; }
      #boot-loader .brand-petal { animation: brand-petal-pulse 2.4s ease-in-out infinite; }
      #boot-loader .brand-wordmark { margin-top: 18px; color: #FFFFFF; font: 700 22px/1.2 system-ui, sans-serif; letter-spacing: .5px; }
      #boot-loader .brand-wordmark-accent { color: #2DD4BF; }
      #boot-loader .brand-label { margin-top: 10px; color: rgba(255,255,255,.55); font: 13px/1.4 system-ui, sans-serif; }
      @keyframes brand-spin { to { transform: rotate(360deg); } }
      @keyframes brand-petal-pulse { 0%,100% { opacity:.75 } 50% { opacity:1 } }
      @media (prefers-reduced-motion: reduce) {
        #boot-loader .brand-mark-spin, #boot-loader .brand-petal { animation: none; }
      }
    </style>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0B1220" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LossLens" />
    <link rel="apple-touch-icon" href="/losslens-icon-192.png" />

    <!-- SEO -->
    <meta name="description" content="LossLens - CBT-based gambling harm reduction platform for Kenya. AI companion, anonymous peer support, and practical recovery tools." />
    <link rel="canonical" href="https://losslens-new.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LossLens" />
    <meta property="og:title" content="LossLens - Your Path Beyond Gambling" />
    <meta property="og:description" content="Free, private gambling support built for Kenya." />
    <meta property="og:url" content="https://losslens-new.vercel.app/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="LossLens - Your Path Beyond Gambling" />
    <meta name="twitter:description" content="Free, private gambling support built for Kenya." />
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-loader" role="status" aria-label="Loading LossLens">
        <svg width="72" height="72" viewBox="0 0 100 100" fill="none" aria-hidden="true">
          <g class="brand-mark-spin">
            <ellipse class="brand-petal" cx="50" cy="26" rx="9" ry="20" fill="#2DD4BF" opacity="0.9" transform="rotate(0 50 50)" />
            <ellipse class="brand-petal" cx="50" cy="26" rx="9" ry="20" fill="#7DBDEE" opacity="0.9" transform="rotate(45 50 50)" style="animation-delay:.1s" />
            <ellipse class="brand-petal" cx="50" cy="26" rx="9" ry="20" fill="#2DD4BF" opacity="0.9" transform="rotate(90 50 50)" style="animation-delay:.2s" />
            <ellipse class="brand-petal" cx="50" cy="26" rx="9" ry="20" fill="#7DBDEE" opacity="0.9" transform="rotate(135 50 50)" style="animation-delay:.3s" />
            <ellipse class="brand-petal" cx="50" cy="26" rx="9" ry="20" fill="#2DD4BF" opacity="0.9" transform="rotate(180 50 50)" style="animation-delay:.4s" />
            <ellipse class="brand-petal" cx="50" cy="26" rx="9" ry="20" fill="#7DBDEE" opacity="0.9" transform="rotate(225 50 50)" style="animation-delay:.5s" />
            <ellipse class="brand-petal" cx="50" cy="26" rx="9" ry="20" fill="#2DD4BF" opacity="0.9" transform="rotate(270 50 50)" style="animation-delay:.6s" />
            <ellipse class="brand-petal" cx="50" cy="26" rx="9" ry="20" fill="#7DBDEE" opacity="0.9" transform="rotate(315 50 50)" style="animation-delay:.7s" />
            <circle cx="50" cy="50" r="12" stroke="#7DBDEE" stroke-width="3" fill="none" />
            <circle cx="50" cy="50" r="4" fill="#2DD4BF" />
          </g>
        </svg>
        <div class="brand-wordmark">Loss<span class="brand-wordmark-accent">Lens</span></div>
        <div class="brand-label">Loading</div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      window.setTimeout(() => document.getElementById('boot-loader')?.remove(), 10000)
    </script>
  </body>
</html>
